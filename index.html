<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoHub Pro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="navbar-brand">
      <div class="brand-icon">
        <svg width="16" height="16" fill="white" viewBox="0 0 20 20">
          <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zm12.553 1.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"/>
        </svg>
      </div>
      <span class="grad-text" id="siteName">VideoHub Pro</span>
    </a>
    <div class="navbar-search">
      <svg class="search-icon" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input id="searchInput" class="input" type="search" placeholder="搜索视频..." data-i18n-ph="search_ph"
           aria-label="搜索视频" data-i18n-title="search_ph">
    </div>
    <div class="navbar-links">
      <a href="index.html" class="nav-link" data-i18n="nav_home">首页</a>
      <!-- 仅已登录的管理员可见，匿名访客看不到此入口 -->
      <a href="admin.html" id="adminLink" class="nav-link" style="display:none;" data-i18n="nav_admin">管理</a>
    </div>
  </div>
</nav>

<!-- 顶部 Banner -->
<div id="bannerTop" class="banner-top" style="display:none;">
  <div class="swiper swiper-top">
    <div class="swiper-wrapper" id="bannerTopSlides"></div>
    <div class="swiper-pagination swiper-pagination-top"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
  </div>
</div>

<!-- 三栏布局 -->
<div class="page-layout">
  <!-- 左侧 Banner -->
  <aside class="sidebar" id="leftSidebar" style="display:none;">
    <div class="swiper sidebar-banner swiper-left" style="height:340px;">
      <div class="swiper-wrapper" id="bannerLeftSlides"></div>
      <div class="swiper-pagination swiper-pagination-left"></div>
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="page-main">
    <!-- 分类筛选栏（动态填充；后端按 category_id 过滤） -->
    <div id="catFilter" class="filter-row" role="tablist" aria-label="分类筛选"></div>

    <!-- 标题行 -->
    <div class="flex items-center justify-between" style="margin-bottom:.75rem;">
      <h2 id="sectionTitle" style="font-size:.9375rem; font-weight:600;">最新视频</h2>
      <span id="totalCount" class="text-muted text-xs"></span>
    </div>

    <!-- 视频网格 -->
    <div id="videoGrid" class="video-grid">
      <div class="loader-wrap"><div class="spinner"></div></div>
    </div>

    <!-- 分页 -->
    <div id="pagination" class="pagination"></div>
  </main>

  <!-- 右侧 Banner -->
  <aside class="sidebar" id="rightSidebar" style="display:none;">
    <div class="swiper sidebar-banner swiper-right" style="height:340px;">
      <div class="swiper-wrapper" id="bannerRightSlides"></div>
      <div class="swiper-pagination swiper-pagination-right"></div>
    </div>
  </aside>
</div>

<!-- 页脚 -->
<footer id="footer">© 2024 VideoHub Pro</footer>

<!-- Toast 容器 -->
<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script type="module">
import { api, isLoggedIn } from './js/api.js';
import { applyI18n, setRuntimeLang, t, safeUrl, esc } from './js/main.js';

// 前台首页固定使用印尼语（Bahasa Indonesia），无语言切换按钮
setRuntimeLang('id');
applyI18n();

// 「管理」入口仅对已登录管理员显示；匿名访客直接浏览，无需任何登录
if (isLoggedIn()) {
  const adminLink = document.getElementById('adminLink');
  if (adminLink) adminLink.style.display = '';
}

// ── 状态 ──────────────────────────────────────────────────────────────────
let state = { page: 1, sort: 'created_at', q: '', category_id: '', totalPages: 1 };

// 骨架屏：加载时先占位，避免「整页空白 → 突然跳出」的闪烁，提升感知速度
const SKELETON = Array.from({ length: 12 }, () =>
  `<div class="video-card skeleton-card">
     <div class="skeleton card-thumb"></div>
     <div class="card-body">
       <div class="skeleton skeleton-line" style="width:90%"></div>
       <div class="skeleton skeleton-line" style="width:55%;margin-top:.5rem"></div>
     </div>
   </div>`).join('');

// ── Toast ─────────────────────────────────────────────────────────────────
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toastStack').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ── 视频卡片 ──────────────────────────────────────────────────────────────
// 标题/分类名一律走 esc()，避免含 < > " 的数据破坏布局或注入脚本
function videoCard(v) {
  const cover = safeUrl(v.cover_url) || `https://picsum.photos/seed/${v.id}/640/360`;
  return `
  <a href="video.html?id=${v.id}" class="video-card">
    <div class="card-thumb">
      <img src="${esc(cover)}" alt="${esc(v.title)}" loading="lazy"
           onerror="this.onerror=null;this.src='https://picsum.photos/seed/${v.id}/640/360'">
      <div class="card-play"><div class="card-play-btn">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 20 20">
          <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
        </svg>
      </div></div>
      ${v.category_name ? `<span class="card-cat">${esc(v.category_name)}</span>` : ''}
    </div>
    <div class="card-body">
      <div class="card-title">${esc(v.title)}</div>
      <div class="card-meta">
        <span>▶ ${v.views}</span>
        <span>${esc(v.created_at || '')}</span>
      </div>
    </div>
  </a>`;
}

// ── 加载视频 ──────────────────────────────────────────────────────────────
async function loadVideos() {
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = SKELETON;

  try {
    const params = { page: state.page, page_size: 12, sort: state.sort };
    if (state.category_id) params.category_id = state.category_id;

    let data;
    if (state.q.trim()) {
      data = await api.search({ ...params, q: state.q });
    } else {
      data = await api.videos(params);
    }

    state.totalPages = data.pages || 1;
    document.getElementById('totalCount').textContent = `${data.total} ${t('unit_videos')}`;
    document.getElementById('sectionTitle').textContent = state.q ? `${t('search_prefix')}「${state.q}」` : t('latest');

    if (!data.items?.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.361a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
        </svg>
        <p>${t('empty')}</p></div>`;
    } else {
      grid.innerHTML = data.items.map(videoCard).join('');
    }
    renderPagination();
  } catch (e) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;color:#ef4444;">${t('load_failed')}：${e.message}</div>`;
  }
}

// ── 分页 ──────────────────────────────────────────────────────────────────
function renderPagination() {
  const el = document.getElementById('pagination');
  if (state.totalPages <= 1) { el.innerHTML = ''; return; }
  let html = '';
  if (state.page > 1) html += `<button class="page-btn" onclick="goPage(${state.page - 1})">${t('prev')}</button>`;
  const start = Math.max(1, state.page - 2), end = Math.min(state.totalPages, state.page + 2);
  for (let i = start; i <= end; i++)
    html += `<button class="page-btn${i === state.page ? ' active' : ''}" onclick="goPage(${i})">${i}</button>`;
  if (state.page < state.totalPages) html += `<button class="page-btn" onclick="goPage(${state.page + 1})">${t('next')}</button>`;
  el.innerHTML = html;
}
window.goPage = (p) => { state.page = p; loadVideos(); window.scrollTo(0, 0); };

// ── Banner ────────────────────────────────────────────────────────────────
async function loadBanners() {
  try {
    const data = await api.banners();

    function fill(position, slidesId, wrapId, swiperClass, paginationClass) {
      const items = data[position] || [];
      if (!items.length) return;
      document.getElementById(wrapId).style.display = '';
      const slidesEl = document.getElementById(slidesId);
      slidesEl.innerHTML = items.map(b => {
        // URL 过滤：挡掉 javascript: 等不安全协议
        const src  = safeUrl(b.image_url);
        const link = safeUrl(b.link_url);
        if (!src) return '';   // 无有效媒体地址则跳过该 slide
        // 支持 image / gif（均用 img）/ video（用 video 标签自动播放）
        const media = b.media_type === 'video'
          ? `<video src="${src}" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;"></video>`
          : `<img src="${src}" alt="${b.title || ''}" style="width:100%;height:100%;object-fit:cover;">`;
        return `<div class="swiper-slide">
          <a href="${link || '#'}" ${link ? 'target="_blank" rel="noopener"' : ''}>
            ${media}
          </a>
        </div>`;
      }).join('');
      new Swiper(`.${swiperClass}`, {
        loop: items.length > 1,
        autoplay: items.length > 1 ? { delay: items[0].duration || 4000, disableOnInteraction: false } : false,
        effect: position === 'top' ? 'fade' : 'slide',
        fadeEffect: { crossFade: true },
        pagination: { el: `.${paginationClass}`, clickable: true },
        navigation: position === 'top' ? { prevEl: '.swiper-button-prev', nextEl: '.swiper-button-next' } : false,
        speed: 500,
      });
    }

    fill('top',   'bannerTopSlides',   'bannerTop',    'swiper-top',   'swiper-pagination-top');
    fill('left',  'bannerLeftSlides',  'leftSidebar',  'swiper-left',  'swiper-pagination-left');
    fill('right', 'bannerRightSlides', 'rightSidebar', 'swiper-right', 'swiper-pagination-right');
  } catch { }
}

// ── 分类筛选 ──────────────────────────────────────────────────────────────
async function loadCategoryFilter() {
  const box = document.getElementById('catFilter');
  try {
    const cats = await api.categories();
    // 只展示有视频的分类，避免一堆空分类干扰浏览
    const usable = (cats || []).filter(c => (c.video_count || 0) > 0);
    if (!usable.length) { box.innerHTML = ''; return; }
    const chip = (id, label, count) =>
      `<button class="chip${String(state.category_id) === String(id) ? ' active' : ''}"
               role="tab" data-cat="${id}" aria-selected="${String(state.category_id) === String(id)}">
         ${esc(label)}${count != null ? ` <span class="chip-count">${count}</span>` : ''}
       </button>`;
    box.innerHTML =
      chip('', t('all'), null) +
      usable.map(c => chip(c.id, c.name, c.video_count)).join('');
  } catch { box.innerHTML = ''; }
}

document.getElementById('catFilter').addEventListener('click', e => {
  const btn = e.target.closest('[data-cat]');
  if (!btn) return;
  const id = btn.dataset.cat;
  if (String(state.category_id) === String(id)) return;
  state.category_id = id;
  state.page = 1;
  // 高亮切换（不重新请求分类，纯前端切 active）
  document.querySelectorAll('#catFilter .chip').forEach(c => {
    const on = c.dataset.cat === id;
    c.classList.toggle('active', on);
    c.setAttribute('aria-selected', on);
  });
  loadVideos();
});

// ── 搜索 ──────────────────────────────────────────────────────────────────
let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.q = e.target.value;
    state.page = 1;
    loadVideos();
  }, 400);
});

// ── 网站设置 ──────────────────────────────────────────────────────────────
async function loadSettings() {
  try {
    const s = await api.settings();
    if (s.site_name) {
      document.getElementById('siteName').textContent = s.site_name;
      document.title = s.site_name;
    }
    if (s.footer_text) document.getElementById('footer').textContent = s.footer_text;
  } catch { }
}

// ── 初始化 ────────────────────────────────────────────────────────────────
loadSettings();
loadBanners();
loadCategoryFilter();
loadVideos();
</script>
</body>
</html>
