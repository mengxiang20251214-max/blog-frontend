<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoHub Pro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 顶部公告栏（内容由 /api/public/announcement 配置；默认折叠隐藏，由 main.js 控制） -->
<div id="announce" class="announce" role="region" aria-label="公告">
  <div class="announce-inner">
    <span class="announce-icon" aria-hidden="true">📢</span>
    <span class="announce-text"></span>
    <button class="announce-close" type="button" aria-label="关闭公告">✕</button>
  </div>
</div>

<div class="bg-aurora" aria-hidden="true"></div>

<!-- 导航栏 -->
<nav class="navbar">
  <div class="navbar-inner">
    <!-- 汉堡菜单（移动端） -->
    <button class="nav-hamburger" id="hamburger" aria-label="菜单" aria-expanded="false">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <a href="index.html" class="navbar-brand">
      <div class="brand-icon">
        <svg width="16" height="16" fill="white" viewBox="0 0 20 20">
          <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zm12.553 1.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"/>
        </svg>
      </div>
      <span class="grad-text" id="siteName">VideoHub Pro</span>
    </a>
    <div class="navbar-search">
      <svg class="search-icon" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input id="searchInput" class="input" type="search" placeholder="搜索视频..." data-i18n-ph="search_ph"
           aria-label="搜索视频" data-i18n-title="search_ph">
    </div>
    <div class="navbar-links">
      <a href="index.html" class="nav-link active" data-i18n="nav_home">首页</a>
      <a href="admin.html" id="adminLink" class="nav-link" style="display:none;" data-i18n="nav_admin">管理</a>
    </div>
  </div>
</nav>

<!-- 侧滑抽屉（移动端汉堡菜单展开） -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span class="grad-text" style="font-weight:800;" data-i18n="menu">菜单</span>
    <button class="btn-icon" id="drawerClose" aria-label="关闭">✕</button>
  </div>
  <nav class="drawer-nav">
    <a class="drawer-link" href="index.html" data-i18n="nav_home">首页</a>
    <a class="drawer-link" href="#categories" id="drawerToCats" data-i18n="cat_title">分类</a>
    <a class="drawer-link" href="#about" data-i18n="about">关于</a>
    <a class="drawer-link" href="admin.html" data-i18n="nav_admin">管理</a>
  </nav>
  <div class="drawer-section-title" data-i18n="cat_title">分类</div>
  <div class="drawer-cats" id="drawerCats"></div>
</aside>

<!-- 主布局：左内容瀑布流 + 右分类栏 -->
<div class="layout">
  <main class="layout-main">
    <div class="section-head">
      <h2 id="sectionTitle" class="section-title">最新视频</h2>
      <span id="totalCount" class="section-count text-muted"></span>
    </div>
    <div id="videoGrid" class="video-grid">
      <div class="loader-wrap"><div class="spinner"></div></div>
    </div>
    <div id="pagination" class="pagination"></div>
  </main>

  <aside class="layout-side" id="layoutSide">
    <!-- 分类列表 -->
    <section class="side-widget" id="categories">
      <h3 class="side-widget-title" data-i18n="cat_title">分类</h3>
      <ul class="side-cats" id="sideCats"></ul>
    </section>
    <!-- 热门标签 -->
    <section class="side-widget" id="hotTagsWidget" style="display:none;">
      <h3 class="side-widget-title" data-i18n="hot_tags">热门标签</h3>
      <div class="tag-cloud" id="hotTags"></div>
    </section>
  </aside>
</div>

<footer id="footer">© 2024 VideoHub Pro</footer>
<div class="toast-stack" id="toastStack"></div>

<script type="module">
import { api, isLoggedIn, mediaUrl } from './js/api.js';
import { applyI18n, setRuntimeLang, t, esc } from './js/main.js';
import { setupDrawer } from './js/menu.js';

setRuntimeLang('id');
applyI18n();

if (isLoggedIn()) {
  const adminLink = document.getElementById('adminLink');
  if (adminLink) adminLink.style.display = '';
}

// ── 状态 ──────────────────────────────────────────────────────────────────
let state = { page: 1, sort: 'created_at', q: '', category_id: '', totalPages: 1 };
let allCats = [];

const SKELETON = Array.from({ length: 12 }, () =>
  `<div class="video-card skeleton-card">
     <div class="skeleton card-thumb"></div>
     <div class="card-body">
       <div class="skeleton skeleton-line" style="width:90%"></div>
       <div class="skeleton skeleton-line" style="width:55%;margin-top:.5rem"></div>
     </div>
   </div>`).join('');

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toastStack').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ── 视频卡片 ──────────────────────────────────────────────────────────────
function videoCard(v) {
  const cover = mediaUrl(v.cover_url) || `https://picsum.photos/seed/${v.id}/640/360`;
  return `
  <a href="video.html?id=${v.id}" class="video-card">
    <div class="card-thumb">
      <img src="${esc(cover)}" alt="${esc(v.title)}" loading="lazy"
           onerror="this.onerror=null;this.src='https://picsum.photos/seed/${v.id}/640/360'">
      <div class="card-play"><div class="card-play-btn">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 20 20">
          <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
        </svg>
      </div></div>
      ${v.category_name ? `<span class="card-cat">${esc(v.category_name)}</span>` : ''}
      <span class="card-views"><svg width="11" height="11" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg> ${v.views}</span>
    </div>
    <div class="card-body">
      <div class="card-title">${esc(v.title)}</div>
      <div class="card-meta">
        <span class="card-date">${esc(v.created_at || '')}</span>
      </div>
    </div>
  </a>`;
}

// ── 加载视频 ──────────────────────────────────────────────────────────────
async function loadVideos() {
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = SKELETON;
  try {
    const params = { page: state.page, page_size: 12, sort: state.sort };
    if (state.category_id) params.category_id = state.category_id;
    let data;
    if (state.q.trim()) data = await api.search({ ...params, q: state.q });
    else data = await api.videos(params);

    state.totalPages = data.pages || 1;
    document.getElementById('totalCount').textContent = `${data.total} ${t('unit_videos')}`;
    document.getElementById('sectionTitle').textContent = state.q ? `${t('search_prefix')}「${state.q}」` : t('latest');

    if (!data.items?.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.361a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
        </svg>
        <p>${t('empty')}</p></div>`;
    } else {
      grid.innerHTML = data.items.map(videoCard).join('');
    }
    renderPagination();
  } catch (e) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;color:#ef4444;">${t('load_failed')}：${e.message}</div>`;
  }
}

// ── 分页 ──────────────────────────────────────────────────────────────────
function renderPagination() {
  const el = document.getElementById('pagination');
  if (state.totalPages <= 1) { el.innerHTML = ''; return; }
  let html = '';
  if (state.page > 1) html += `<button class="page-btn" onclick="goPage(${state.page - 1})">${t('prev')}</button>`;
  const start = Math.max(1, state.page - 2), end = Math.min(state.totalPages, state.page + 2);
  for (let i = start; i <= end; i++)
    html += `<button class="page-btn${i === state.page ? ' active' : ''}" onclick="goPage(${i})">${i}</button>`;
  if (state.page < state.totalPages) html += `<button class="page-btn" onclick="goPage(${state.page + 1})">${t('next')}</button>`;
  el.innerHTML = html;
}
window.goPage = (p) => { state.page = p; loadVideos(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

// ── 分类列表 + 热门标签 + 抽屉分类 ─────────────────────────────────────────
async function loadCategories() {
  try {
    allCats = (await api.categories() || []).filter(c => (c.video_count || 0) > 0);
  } catch { allCats = []; }
  renderCategories();
  drawer.renderCategories(allCats, state.category_id);
}

function renderCategories() {
  // 侧边分类列表
  const list = document.getElementById('sideCats');
  const row = (id, label, count, active) =>
    `<li><button class="side-cat${active ? ' active' : ''}" data-cat="${id}">
       <span class="truncate">${esc(label)}</span>
       ${count != null ? `<span class="side-cat-count">${count}</span>` : ''}
     </button></li>`;
  list.innerHTML =
    row('', t('all'), null, !state.category_id) +
    allCats.map(c => row(c.id, c.name, c.video_count, String(state.category_id) === String(c.id))).join('');

  // 热门标签（按视频数排序，取前 12）
  const hot = [...allCats].sort((a, b) => (b.video_count || 0) - (a.video_count || 0)).slice(0, 12);
  if (hot.length) {
    document.getElementById('hotTags').innerHTML = hot.map(c =>
      `<button class="tag${String(state.category_id) === String(c.id) ? ' active' : ''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('');
    document.getElementById('hotTagsWidget').style.display = '';
  }
}

function selectCategory(id) {
  state.category_id = String(id);
  state.page = 1;
  loadVideos();
  renderCategories();
  drawer.setActive(state.category_id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('sideCats').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (b) selectCategory(b.dataset.cat);
});
document.getElementById('hotTags').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (b) selectCategory(b.dataset.cat);
});

// ── 汉堡抽屉 ───────────────────────────────────────────────────────────────
const drawer = setupDrawer({ onCategory: selectCategory });
// 抽屉里「分类」链接 → 滚动到右侧分类栏
document.getElementById('drawerToCats').addEventListener('click', e => {
  e.preventDefault();
  drawer.close();
  document.getElementById('categories').scrollIntoView({ behavior: 'smooth' });
});

// ── 搜索 ──────────────────────────────────────────────────────────────────
let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = e.target.value; state.page = 1; loadVideos(); }, 400);
});

// ── 网站设置 ───────────────────────────────────────────────────────────────
async function loadSettings() {
  try {
    const s = await api.settings();
    if (s.site_name) { document.getElementById('siteName').textContent = s.site_name; document.title = s.site_name; }
    if (s.footer_text) document.getElementById('footer').textContent = s.footer_text;
  } catch { }
}

// ── 初始化 ────────────────────────────────────────────────────────────────
loadSettings();
loadCategories();
loadVideos();
</script>
</body>
</html>
